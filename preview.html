  <script>/** Pure data helpers. No medical target or diagnosis is derived here. */
const dayKey = (d = new Date()) => {
  const y = d.getFullYear();
  return `${y}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};
const weekStart = (d = new Date()) => {
  const out = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  out.setDate(out.getDate() - ((out.getDay()+6)%7));
  return out;
};
const weekKeys = (d = new Date()) => Array.from({length:7},(_,i)=> {
  const v = weekStart(d); v.setDate(v.getDate()+i); return dayKey(v);
});
const normalizedFood = s => String(s || '').toLowerCase().normalize('NFKD')
  .replace(/[^a-z0-9\s]/g,' ').replace(/\b(fresh|frozen|cooked|raw|organic|low fat|large|small|boneless|skinless)\b/g,' ')
  .replace(/\s+/g,' ').trim().replace(/ies$/,'y').replace(/s$/,'');
function hasIngredient(pantry, ingredient) {
  const target = normalizedFood(ingredient);
  if (!target) return false;
  return pantry.some(p=>{
    const own = normalizedFood(p.name);
    return own === target || own.includes(target) || target.includes(own) && own.length>2;
  });
}
function missingIngredients(pantry, ingredients) {
  return ingredients.filter(i=>!hasIngredient(pantry, i));
}
function uniqueShopping(existing, added) {
  const present = new Set(existing.map(x=>normalizedFood(x.name)));
  return added.filter(x=>!present.has(normalizedFood(x))).map(x=>({id:globalThis.crypto?.randomUUID?.() || Math.random().toString(36).slice(2),name:x,checked:false}));
}
const sumForDay = (entries, key, field = 'amount') => entries.filter(e=>e.date===key).reduce((s,e)=>s+(Number(e[field])||0),0);
const clamp = (n, min, max) => Math.min(max,Math.max(min,Number(n)||0));
const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const progressValue = (value,target) => target>0 ? Math.max(0,Math.min(100,Math.round(value/target*100))) : null;
function goalProgress(goal, data, today=new Date()) {
  const dates=weekKeys(today), current=dayKey(today);
  if (goal.metric==='water') return sumForDay(data.water, current);
  if (goal.metric==='movement') return data.activityLogs.filter(x=>dates.includes(x.date)).reduce((s,x)=>s+(Number(x.minutes)||0),0);
  if (goal.metric==='mobility') return data.activityLogs.filter(x=>dates.includes(x.date)&&x.category==='mobility').length;
  if (goal.metric==='meals') return data.mealLogs.filter(x=>dates.includes(x.date)).length;
  if (goal.metric==='manual') return data.goalLogs.filter(x=>x.goalId===goal.id&&dates.includes(x.date)).length;
  return 0;
}
const uid=()=>globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(36).slice(2)}`;

const e=escapeHTML;

function kitchenRecipes(){const set=filteredRecipes(),filtered=set.filter(r=>ui.recipeFilter==='all'||r.category===ui.recipeFilter||r.tags.includes(ui.recipeFilter));return `<div class="banner-note">✦ <strong>Your pantry is a guide, not a guarantee.</strong> This version checks whether an ingredient is listed, not whether you have enough. Dietary exclusions are simple text filters — always check recipes and food labels for allergens.</div><div class="section-row" style="margin-top:0"><div><h2>What sounds good?</h2><p class="muted small" style="margin-top:4px">${set.length} ideas available after your saved ingredient exclusions.</p></div><select style="max-width:220px" aria-label="Filter recipes" data-filter="recipe" id="recipe-filter"><option value="all">All recipes</option>${['Breakfast','Lunch & dinner','Plant-based','Meal prep','No cook','Quick'].map(x=>`<option value="${e(x)}" ${ui.recipeFilter===x?'selected':''}>${e(x)}</option>`).join('')}</select></div><div class="grid grid-3">${filtered.map(recipeCard).join('')||empty('🥬','No recipes found','Try another category or update your ingredient exclusions.')}</div><div class="info-note spaced">Ingredient combinations are original, illustrative ideas, not complete nutrition prescriptions. Protein/calorie totals are intentionally not invented. A verified food database and portion calculator are planned for a later phase.</div>`;}
function recipeCard(r){const missing=missingIngredients(data.pantry,r.ingredients);return `<article class="card recipe-card"><div class="recipe-banner ${r.accent}" aria-label="Food illustration">${r.emoji}</div><div class="recipe-info"><div class="badge-stack">${r.tags.map(x=>`<span class="badge">${e(x)}</span>`).join('')}<span class="badge">${r.minutes} min</span></div><h3>${e(r.title)}</h3><p>${r.ingredients.length-missing.length} of ${r.ingredients.length} ingredients on your pantry list</p><div class="progress-track" style="margin:2px 0 0;height:6px"><div class="progress-fill" style="width:${Math.round((r.ingredients.length-missing.length)/r.ingredients.length*100)}%"></div></div></div><div class="recipe-actions">${actionBtn('recipe-details','View recipe',`data-id="${r.id}"`)}${actionBtn('recipe-missing',`+ ${missing.length} missing`, `data-id="${r.id}"`, 'ghost')}</div></article>`;}
function kitchenPantry(){return `<div class="grid kitchen-two"><div class="card"><h2 style="margin-bottom:8px">What's on hand?</h2><p class="muted small" style="margin-bottom:21px">Add food you've got. You'll see recipe matches as your pantry grows.</p><form data-form="pantry"><div class="form-field"><label for="pantry-name">Ingredient name</label><input name="name" id="pantry-name" required maxlength="120" placeholder="e.g. chicken breast"></div><div class="grid grid-2"><div class="form-field"><label for="pantry-quantity">Amount (optional)</label><input name="quantity" id="pantry-quantity" maxlength="90" placeholder="e.g. 2 lb, 1 carton"></div><div class="form-field"><label for="pantry-expiry">Use-by note (optional)</label><input name="expiry" id="pantry-expiry" type="date"></div></div><button class="btn" type="submit">+ Add to pantry</button></form><div class="info-note spaced">Quantities and dates are notes, not live inventory tracking. Don't rely on the app to decide whether food is safe to eat.</div></div><div class="card"><div class="card-top"><h3>On your shelf <span class="muted">(${data.pantry.length})</span></h3></div>${data.pantry.length?data.pantry.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(x=>`<div class="list-item"><div class="grow"><div class="list-title">${e(x.name)}</div><div class="subtext">${e(x.quantity||'Quantity not noted')}${x.expiry?' · Date: '+e(dayLabel(x.expiry)):''}</div></div><button class="icon-btn" data-action="remove-pantry" data-id="${x.id}" aria-label="Remove ${e(x.name)}">×</button></div>`).join(''):empty('🥬','A fresh start','Add a few items you already have. No need to inventory your whole kitchen.')}</div></div>`;}
function kitchenShopping(){const checked=data.shopping.filter(x=>x.checked).length;return `<div class="grid kitchen-two"><div class="card"><div class="card-top"><h2>Grocery list</h2><span class="pill">${data.shopping.length} items</span></div><p class="muted small" style="margin-bottom:19px">Add an item or send missing recipe ingredients here with one tap.</p><form class="input-row" data-form="shopping"><div class="form-field"><label for="shopping-name">Add anything you need</label><input name="name" id="shopping-name" required maxlength="120" placeholder="e.g. blueberries"></div><button class="btn" type="submit">+ Add</button></form><div class="line"></div>${data.shopping.length?data.shopping.map(x=>`<div class="list-item"><label class="check-row grow"><input type="checkbox" data-action="toggle-shopping" data-id="${x.id}" ${x.checked?'checked':''}><span style="${x.checked?'text-decoration:line-through;color:#96a498':''}">${e(x.name)}</span></label><button class="icon-btn" data-action="remove-shopping" data-id="${x.id}" aria-label="Remove ${e(x.name)}">×</button></div>`).join(''):empty('🛒','Your list is clear','Open a recipe and add any ingredients you need.')}${checked?`<div class="form-actions" style="margin-top:18px">${actionBtn('move-shopping','Add checked to pantry','')}${actionBtn('clear-shopping','Remove checked','','ghost')}</div>`:''}</div><div class="card mint"><h3>Make shopping simpler</h3><div class="stack" style="margin-top:16px"><div class="tile"><span class="tile-icon">1</span><div><strong>Pick a meal</strong><p>Browse protein-forward ideas that fit your tastes.</p></div></div><div class="tile"><span class="tile-icon">2</span><div><strong>Check what's home</strong><p>You'll see which ingredients aren't listed in your pantry.</p></div></div><div class="tile"><span class="tile-icon">3</span><div><strong>Shop and update</strong><p>Move checked-off groceries into your pantry list.</p></div></div></div><div style="margin-top:20px">${actionBtn('kitchen-tab','Browse meal ideas','data-tab="recipes"')}</div></div></div>`;}
function kitchenPlan(){const plan=data.mealPlan.slice().sort((a,b)=>a.date.localeCompare(b.date));return `<div class="grid kitchen-two"><div class="card"><h2 style="margin-bottom:8px">Make a gentle plan</h2><p class="muted small" style="margin-bottom:17px">A flexible list of meals — swap days, cook leftovers, or change your mind.</p><form data-form="meal-plan"><div class="form-field"><label for="meal-choice">Choose an idea</label><select name="recipeId" id="meal-choice" required>${filteredRecipes().map(r=>`<option value="${r.id}">${e(r.title)}</option>`).join('')}</select></div><div class="grid grid-2"><div class="form-field"><label for="meal-date">Day</label><input type="date" name="date" id="meal-date" required value="${today()}"></div><div class="form-field"><label for="meal-slot">Meal</label><select name="slot" id="meal-slot"><option>Breakfast</option><option>Lunch</option><option selected>Dinner</option><option>Snack</option></select></div></div><button class="btn" type="submit" ${filteredRecipes().length?'':'disabled'}>+ Add meal to plan</button></form><div class="info-note spaced">Planning doesn't deduct pantry amounts. Recipes are ideas; follow food-safe cooking and storage practices.</div></div><div class="card"><div class="card-top"><h3>Coming up</h3><span class="pill">${plan.length} planned</span></div>${plan.length?plan.map(p=>{const r=recipes.find(x=>x.id===p.recipeId);return `<div class="list-item" style="align-items:flex-start"><div class="grow"><span class="caps">${e(dayLabel(p.date))} · ${e(p.slot)}</span><div class="list-title" style="margin-top:5px">${e(r?.title||'Saved meal')}</div><div class="subtext">Ready to adapt to your appetite and schedule.</div><div class="quick-actions">${actionBtn('log-meal','Had this meal',`data-id="${p.id}"`,'ghost')}${actionBtn('recipe-details','Recipe',`data-id="${p.recipeId}"`,'ghost')}</div></div><button class="icon-btn" data-action="remove-plan" data-id="${p.id}" aria-label="Remove planned meal">×</button></div>`}).join(''):empty('📅','No pressure to plan a week','Start with just one meal you might want tomorrow.')}</div></div>`;}
function moveView(){const selected=ui.moveFilter,choices=[['all','All'],['rebounder','Rebounder'],['cardio','Cardio'],['mobility','Mobility'],['strength','Strength'],['recovery','Rest']];const thisWeek=data.activityLogs.filter(x=>weekKeys().includes(x.date));const minutes=thisWeek.reduce((s,x)=>s+x.minutes,0);return `${pageIntro('MOVE & RESTORE','Move more freely, one day at a time.','Choose low-pressure movement to build comfortable routines. Rebounding is one option, not the only way forward.')}
 <div class="banner-note"><strong>Before progressing:</strong> New, unusual, persistent, or worsening breathlessness during normal activities deserves medical assessment. Stop if you feel chest pain, faintness, severe shortness of breath, or unsteadiness. <a href="https://www.lung.org/lung-health-diseases/warning-signs-of-lung-disease/shortness-of-breath" target="_blank" rel="noopener noreferrer">American Lung Association guidance ↗</a></div>
 <div class="grid grid-3" style="margin-bottom:24px"><div class="card mint"><span class="caps">MOVEMENT THIS WEEK</span><div class="metric-number" style="margin-top:9px">${unit(minutes)}<span style="font-size:1.2rem"> min</span></div><p class="small muted">A record, not a requirement.</p></div><div class="card peach"><span class="caps">SESSIONS</span><div class="metric-number" style="margin-top:9px">${thisWeek.length}</div><p class="small muted">Each comfortable session counts.</p></div><div class="card lavender"><span class="caps">YOUR AVAILABLE TIME</span><div class="metric-number" style="margin-top:9px">${unit(data.profile.availableMinutes)}<span style="font-size:1.2rem"> min</span></div><p class="small muted">Editable in settings anytime.</p></div></div>
 <div class="section-row"><h2>Choose a movement</h2><span class="muted small">Start only at your comfort level.</span></div><div class="chips" style="margin-bottom:20px">${choices.map(([id,label])=>`<button class="chip ${selected===id?'selected':''}" data-action="move-filter" data-filter="${id}" aria-pressed="${selected===id}">${label}</button>`).join('')}</div><div class="grid grid-3">${activities.filter(x=>selected==='all'||selected===x.category).map(a=>`<div class="card activity-card"><div class="activity-symbol">${a.icon}</div><h3>${e(a.name)}</h3><div class="meta"><span class="pill">${a.minutes} min idea</span><span class="pill">${e(a.level)}</span></div><p>${e(a.desc)}</p>${actionBtn('session','See steps & start',`data-id="${a.id}"`,'secondary')}</div>`).join('')}</div><div class="section-row"><h2>Your recent movement</h2></div><div class="card">${data.activityLogs.length?data.activityLogs.slice(-7).reverse().map(log=>{const a=activities.find(x=>x.id===log.activityId);return `<div class="list-item"><div><strong class="small">${e(a?.name||log.name||'Movement')}</strong><p class="small muted">${e(dayLabel(log.date))} · ${unit(log.minutes)} min · ${e(log.note||'Logged')}</p></div><button class="icon-btn" data-action="remove-activity" data-id="${log.id}" aria-label="Delete activity entry">×</button></div>`}).join(''):empty('🌿','Every beginning counts','When you try an activity, log only what you want to remember.')}</div><div class="info-note spaced">The CDC describes 150 minutes of moderate aerobic activity weekly and strength activity on two days as general adult population guidance. These aren't automatic targets for you; build gradually around your circumstances and clinician guidance. <a href="https://www.cdc.gov/physical-activity-basics/adding-adults/" target="_blank" rel="noopener noreferrer">Read CDC guidance ↗</a></div>`;}
function goalsView(){return `${pageIntro('YOUR COMPASS','Goals that grow with you.','You define success. Set a small goal, edit it whenever life changes, or track nothing at all.')}
 <div class="card mint" style="margin-bottom:24px"><div class="card-top"><div class="card-title">✿ &nbsp; What matters to you</div>${link('settings','Change my interests →')}</div><div class="chips">${data.profile.focus.length?data.profile.focus.map(f=>`<span class="chip">✓ ${e(f)}</span>`).join(''):'<span class="muted small">No focus areas selected yet. You can choose them anytime.</span>'}</div></div><div class="grid kitchen-two"><div class="card"><h2 style="margin-bottom:8px">Create a personal goal</h2><p class="muted small" style="margin-bottom:20px">Choose your own number. No automatic weight, water, or protein target will be assigned.</p><form data-form="goal"><div class="form-field"><label for="goal-title">Name this goal</label><input id="goal-title" required name="title" maxlength="100" placeholder="e.g. Move a little most days"></div><div class="grid grid-2"><div class="form-field"><label for="goal-metric">How to notice progress</label><select id="goal-metric" name="metric">${Object.entries(METRICS).map(([k,v])=>`<option value="${k}">${e(v[0])}</option>`).join('')}</select></div><div class="form-field"><label for="goal-target">Your chosen target</label><input id="goal-target" type="number" name="target" required min="1" max="10000" step="1" placeholder="Choose a number"></div></div><button class="btn" type="submit">+ Add goal</button></form><div class="info-note spaced">You can use the app with no numeric goals. If you prefer, track how you feel without measuring anything.</div></div><div class="card"><h3 style="margin-bottom:15px">My active goals <span class="muted">(${data.goals.length})</span></h3>${data.goals.length?data.goals.map(g=>{const current=goalProgress(g,data);const pct=progressValue(current,g.target);return `<div class="goal-card" style="border-bottom:1px solid var(--line);padding:12px 0"><div class="row between"><div class="grow"><div class="strong">${e(g.title)}</div><p class="muted small" style="margin-top:4px">${e(modeLabel(g.metric)[1])}</p></div>${actionBtn('edit-goal','Edit',`data-id="${g.id}"`,'ghost')}<button class="icon-btn" data-action="remove-goal" data-id="${g.id}" aria-label="Remove goal">×</button></div><div class="progress-track"><div class="progress-fill" style="width:${pct??0}%"></div></div><div class="row between"><span class="small muted">${unit(current)} / ${unit(g.target)} (self-selected)</span>${g.metric==='manual'?actionBtn('log-manual-goal','+ Log a moment',`data-id="${g.id}"`,'ghost'):''}</div>${ui.editGoalId===g.id?`<form data-form="edit-goal" data-id="${g.id}" style="margin-top:13px"><div class="form-field"><label>Goal name</label><input name="title" required maxlength="100" value="${e(g.title)}"></div><div class="grid grid-2"><div class="form-field"><label>Metric</label><select name="metric">${Object.entries(METRICS).map(([k,v])=>`<option value="${k}" ${g.metric===k?'selected':''}>${e(v[0])}</option>`).join('')}</select></div><div class="form-field"><label>Target you choose</label><input name="target" type="number" min="1" max="10000" required value="${g.target}"></div></div><button type="submit" class="btn small">Save changes</button></form>`:''}</div>`}).join(''):empty('🎯','Make your own milestones','Your first goal can be anything meaningful to you — or skip it entirely.')}</div></div><div class="section-row"><h2>What progress can mean</h2></div><div class="grid grid-3"><div class="card peach"><div class="stat-icon">↗</div><h3 style="margin:13px 0 7px">Less breathless</h3><p class="muted small">Record how comfortable normal activity feels, if helpful. Unusual breathlessness still deserves clinical attention.</p></div><div class="card mint"><div class="stat-icon">✺</div><h3 style="margin:13px 0 7px">More capable</h3><p class="muted small">Notice everyday abilities, flexibility, and how a movement feels, not just numbers.</p></div><div class="card lavender"><div class="stat-icon">♡</div><h3 style="margin:13px 0 7px">More ease</h3><p class="muted small">Simpler meal decisions, better rest, and taking time for yourself are progress too.</p></div></div>`;}
function wellnessView(){return `${pageIntro('CARE & RECOVER','Wellness that fits real life.','A flexible place for hydration, supplement records, reminders, and how you feel. Everything here is optional.')}
 <div class="tabs" role="tablist" aria-label="Wellness sections">${[['water','Hydration'],['supplements','Supplements'],['reflections','Check-ins'],['reminders','Reminders']].map(([id,l])=>`<button role="tab" aria-selected="${ui.wellnessTab===id}" class="tab ${ui.wellnessTab===id?'active':''}" data-action="wellness-tab" data-tab="${id}">${l}</button>`).join('')}</div>${({water:waterView,supplements:supplementsView,reflections:reflectionsView,reminders:remindersView})[ui.wellnessTab]()}`;}
function waterView(){const key=today(),todayWater=data.water.filter(x=>x.date===key),total=sumForDay(data.water,key);return `<div class="grid kitchen-two"><div class="card mint"><div class="card-top"><h2>A little sip at a time</h2><span class="pill">Today</span></div><div class="water-card"><div><div class="metric-number">${unit(total)} <span style="font-size:1.2rem">oz</span></div><p class="muted small">${data.profile.waterGoalOz?`${data.profile.waterGoalOz} oz · your optional daily goal`:'No daily water target chosen'}</p><div class="quick-actions">${actionBtn('add-water','+ 8 oz','data-oz="8"')}${actionBtn('add-water','+ 12 oz','data-oz="12"')}${actionBtn('add-water','+ 16 oz','data-oz="16"')}</div></div>${ring(total,data.profile.waterGoalOz)}</div><form class="input-row" data-form="water" style="margin-top:22px"><div class="form-field"><label for="drink-amount">Log another amount (oz)</label><input name="amount" id="drink-amount" type="number" min="1" max="256" required placeholder="e.g. 20"></div><button class="btn" type="submit">Log water</button></form><div class="line"></div><form data-form="water-target"><div class="form-field"><label for="water-target">Set or change your own optional daily goal (oz)</label><input name="target" id="water-target" type="number" min="1" max="256" value="${e(data.profile.waterGoalOz||'')}" placeholder="Leave blank for no target"></div><button class="btn secondary" type="submit">Save preference</button></form></div><div class="card"><h3 style="margin-bottom:16px">Today's drinks logged</h3>${todayWater.length?todayWater.slice().reverse().map(w=>`<div class="list-item"><div><strong>${unit(w.amount)} oz water</strong><p class="small muted">${new Date(w.at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</p></div><button class="icon-btn" data-action="remove-water" data-id="${w.id}" aria-label="Remove water log">×</button></div>`).join(''):empty('💧','No logging required','You can drink water without tracking every glass.') }<div class="info-note spaced">Your needs can vary with activity, climate and health conditions. A clinician-set fluid limit takes priority over app goals. General population "total water" references include food and beverages, not just plain water. <a href="https://www.cdc.gov/healthy-weight-growth/water-healthy-drinks/index.html" target="_blank" rel="noopener noreferrer">CDC water guidance ↗</a></div></div></div>`;}
function supplementsView(){const takenIds=new Set(data.suppLogs.filter(x=>x.date===today()).map(x=>x.supplementId));return `<div class="banner-note"><strong>A tracking tool, not a supplement recommendation.</strong> This prototype cannot establish what Jenny needs, whether a supplement is safe with medications, or an appropriate dose. Review plans with her clinician or pharmacist. <a href="https://ods.od.nih.gov/factsheets/WYNTK-Consumer/" target="_blank" rel="noopener noreferrer">NIH supplement guidance ↗</a></div><div class="grid kitchen-two"><div class="card"><h2 style="margin-bottom:8px">My supplement list</h2><p class="muted small" style="margin-bottom:21px">Save a supplement you've chosen or been advised to use. Any directions below come from you or your clinician, not the app.</p><form data-form="supplement"><div class="form-field"><label for="supp-name">Supplement name</label><input id="supp-name" name="name" required maxlength="120" placeholder="Enter the product label"></div><div class="form-field"><label for="supp-directions">Label or clinician instructions (optional)</label><input id="supp-directions" name="instructions" maxlength="200" placeholder="As written on your label or instructions"></div><div class="grid grid-2"><div class="form-field"><label for="supp-frequency">Your chosen schedule</label><select id="supp-frequency" name="frequency"><option value="daily">Daily</option><option value="weekdays">Weekdays</option><option value="as-needed">As needed</option></select></div><div class="form-field"><label for="supp-time">Preferred time (optional)</label><input type="time" id="supp-time" name="time"></div></div><label class="check-row" style="margin-bottom:17px"><input type="checkbox" name="reviewed" value="yes"> I've reviewed this with a health professional</label><button class="btn" type="submit">+ Save to my list</button></form></div><div class="card"><h3 style="margin-bottom:15px">My list (${data.supplements.length})</h3>${data.supplements.length?data.supplements.map(s=>{const taken=takenIds.has(s.id);return `<div class="list-item"><div class="grow"><div class="list-title">${e(s.name)}</div><div class="subtext">${e(s.instructions||'No instructions stored')} · ${s.frequency==='weekdays'?'Weekdays':s.frequency==='as-needed'?'As needed':'Daily'}${s.time?' · '+e(s.time):''}</div><div class="subtext">${s.reviewed?'✓ User-marked as clinician/pharmacist reviewed':'Not marked reviewed'}</div><div class="quick-actions">${actionBtn(taken?'undo-supp':'take-supp',taken?'✓ Logged today':'Mark taken',`data-id="${s.id}"`,taken?'ghost':'secondary')}</div></div><button class="icon-btn" data-action="remove-supp" data-id="${s.id}" aria-label="Remove supplement">×</button></div>`}).join(''):empty('🌱','Your list is empty','Only add products you have actually chosen to discuss or take.')}</div></div><div class="info-note spaced">This list is not a clinical medication record. It cannot check contraindications, interactions, duplicate ingredients, or skipped-dose rules. Never take an extra dose because a reminder was missed. Discuss dosage and any interactions with a pharmacist or clinician. <a href="https://www.fda.gov/consumers/consumer-updates/fda-101-dietary-supplements" target="_blank" rel="noopener noreferrer">FDA information ↗</a></div>`;}
function reflectionsView(){const recent=data.checkins.slice().sort((a,b)=>b.date.localeCompare(a.date));return `<div class="grid kitchen-two"><div class="card"><h2 style="margin-bottom:8px">How did today feel?</h2><p class="muted small" style="margin-bottom:18px">Save only the observations you want. These notes are not used to diagnose or explain symptoms.</p><form data-form="checkin"><div class="form-field"><label for="checkin-energy">Energy today (optional)</label><select id="checkin-energy" name="energy"><option value="">No rating</option>${['Low','Okay','Good','Great','Bright'].map((s,i)=>`<option value="${i+1}">${s}</option>`).join('')}</select></div><div class="grid grid-2"><div class="form-field"><label for="checkin-sleep">Sleep last night (optional)</label><select id="checkin-sleep" name="sleep"><option value="">Prefer not to track</option><option>Restful</option><option>Mixed</option><option>Interrupted</option></select></div><div class="form-field"><label for="checkin-feel">Comfort during normal activities (optional)</label><select id="checkin-feel" name="comfort"><option value="">Skip</option><option>Comfortable</option><option>Some effort</option><option>More breathless than usual</option></select></div></div><div class="form-field"><label for="checkin-note">One thing you noticed (optional)</label><textarea id="checkin-note" name="note" maxlength="500" placeholder="What felt easier or harder today?"></textarea></div><button class="btn" type="submit">Save today's reflection</button></form><div class="line"></div><h3 style="margin-bottom:12px">Optional weight trend</h3><p class="muted small" style="margin-bottom:13px">Track only if this feels useful. No automatic target or judgment.</p><form class="input-row" data-form="weight"><div class="form-field"><label for="weight-lb">Weight (lb), optional</label><input id="weight-lb" name="weight" type="number" min="50" max="800" step="0.1" required placeholder="Only if you want"></div><button class="btn secondary" type="submit">Save privately</button></form></div><div class="card"><h3 style="margin-bottom:16px">Recent reflections</h3>${recent.length?recent.slice(0,7).map(c=>`<div class="list-item"><div class="grow"><div class="list-title">${e(dayLabel(c.date))}</div><p class="subtext">${c.energy?'Energy: '+['','Low','Okay','Good','Great','Bright'][c.energy]+' · ':''}${e(c.sleep||'')}${c.comfort?' · '+e(c.comfort):''}</p>${c.note?`<p class="small" style="margin-top:6px">${e(c.note)}</p>`:''}</div><button class="icon-btn" data-action="remove-checkin" data-id="${c.id}" aria-label="Delete check-in">×</button></div>`).join(''):empty('☀','A fresh page','If you want to notice trends, start with a small reflection.')}${data.weights.length?`<div class="line"></div><h3>Private weight notes</h3>${data.weights.slice(-5).reverse().map(w=>`<div class="list-item"><div><strong>${e(w.weight)} lb</strong><p class="small muted">${e(dayLabel(w.date))}</p></div><button class="icon-btn" data-action="remove-weight" data-id="${w.id}" aria-label="Delete weight record">×</button></div>`).join('')}`:''}</div></div><div class="info-note spaced danger-note">If ordinary activities now cause unusual, worsening or persistent breathlessness, speak with a clinician. Sudden severe breathlessness, chest pain, fainting or blue lips can need urgent emergency care. <a href="https://www.lung.org/lung-health-diseases/warning-signs-of-lung-disease/shortness-of-breath" target="_blank" rel="noopener noreferrer">Learn when to seek care ↗</a></div>`;}

function settingsView(){return `${pageIntro('IT\'S YOUR SPACE','Settings & privacy.','Make every part of the experience fit your life. You can change your mind about anything.')}
 <div class="grid kitchen-two"><div class="card"><h2 style="margin-bottom:19px">About you</h2><form data-form="settings"><div class="form-field"><label for="settings-name">Preferred name</label><input id="settings-name" name="name" maxlength="50" value="${e(data.profile.name)}" placeholder="Your name"></div><div class="grid grid-2"><div class="form-field"><label for="settings-minutes">Time I usually have</label><select id="settings-minutes" name="availableMinutes">${[5,10,15,20,30].map(v=>`<option value="${v}" ${data.profile.availableMinutes===v?'selected':''}>${v} minutes</option>`).join('')}</select></div><div class="form-field"><label for="settings-goal">Optional daily water goal (oz)</label><input id="settings-goal" name="waterGoalOz" type="number" min="1" max="256" value="${e(data.profile.waterGoalOz||'')}" placeholder="No goal"></div></div><div class="form-field"><label for="settings-preferences">Foods I enjoy / meal preferences</label><input id="settings-preferences" name="foodPreferences" maxlength="300" value="${e(data.profile.foodPreferences)}" placeholder="Optional"></div><div class="form-field"><label for="settings-avoid">Ingredient exclusions (comma-separated)</label><input id="settings-avoid" name="avoidFoods" maxlength="300" value="${e(data.profile.avoidFoods)}" placeholder="Optional — always verify labels"></div><div class="form-field"><span class="field-label">My focus areas (tap to change)</span><div class="chips">${FOCUS.map(([label])=>`<button type="button" class="chip ${data.profile.focus.includes(label)?'selected':''}" data-action="toggle-profile-focus" data-focus="${e(label)}" aria-pressed="${data.profile.focus.includes(label)}">${e(label)}</button>`).join('')}</div></div><button class="btn" type="submit">Save preferences</button></form></div><div class="card"><h2 style="margin-bottom:18px">Your data belongs to you</h2><div class="setting-row"><div><strong>Saved on this device only</strong><p>No cloud account, synchronization, or encryption beyond your browser's protections. People using the same browser profile may access these entries.</p></div><span class="pill">Preview</span></div><div class="setting-row"><div><strong>Export my data</strong><p>Download a JSON copy of your own entries, preferences and goals.</p></div>${actionBtn('export','Export JSON')}</div><div class="setting-row"><div><strong>Restore a backup</strong><p>Import a JSON backup exported from Jenny's Bloom on this or another device. Replaces the current browser records after confirmation.</p></div>${actionBtn('restore','Import backup')}</div><input id="backup-file" type="file" accept=".json,application/json" style="display:none" aria-label="Choose Jenny's Bloom backup"><div class="setting-row"><div><strong>Clear my data</strong><p>Delete all records and start onboarding again. This cannot be undone.</p></div>${actionBtn('clear-all','Delete all','','ghost')}</div><div class="setting-row"><div><strong>Notifications</strong><p>Only while this page remains open; manage them in Wellness.</p></div>${link('wellness','Manage →')}</div><div class="setting-row"><div><strong>Sharing</strong><p>No spouse dashboard, analytics, trackers, advertising or external AI calls are implemented. You decide what you share.</p></div><span class="pill">Off</span></div></div></div><div class="info-note spaced">This is a functional local-browser prototype, not a secure medical records system. Before storing real sensitive data across devices, production needs authentication, server-side permissions, encrypted transport, storage safeguards, deletion controls, and tested backups. <strong>Do not use this demo as your only supplement/medication record.</strong></div>`;}
function modalView(){if(!ui.modal)return '';if(ui.modal.type==='recipe'){const r=recipes.find(x=>x.id===ui.modal.id);if(!r)return '';const missing=missingIngredients(data.pantry,r.ingredients);return `<div class="modal-backdrop" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><span class="caps">${e(r.category)} · ${r.minutes} MIN</span><h2 id="modal-title" style="margin-top:8px">${r.emoji} ${e(r.title)}</h2><p>${e(r.note)}</p></div><button class="icon-btn" data-action="close-modal" aria-label="Close recipe">×</button></div><div class="line"></div><h3>Ingredients</h3><div class="chips" style="margin:12px 0">${r.ingredients.map(i=>`<span class="chip" style="${missing.includes(i)?'background:#fff3e7;border-color:#f0ddc5':''}">${missing.includes(i)?'＋':'✓'} ${e(i)}</span>`).join('')}</div><p class="small muted">✓ appears on your pantry list · ＋ is not listed. Amounts aren't checked yet.</p><h3 style="margin:19px 0 9px">Simple steps</h3><ol class="modal-steps">${r.steps.map(s=>`<li>${e(s)}</li>`).join('')}</ol><div class="banner-note" style="margin-bottom:0">Cook and store foods safely. Refrigerate perishables promptly; use refrigerated cooked leftovers within 3–4 days or freeze. Always follow allergy and medical guidance.</div><div class="modal-actions">${actionBtn('recipe-missing',`Add ${missing.length} missing to list`,`data-id="${r.id}"`,'secondary')}${actionBtn('log-direct-meal','Log meal tried',`data-id="${r.id}"`,'ghost')}</div><div class="line"></div><form data-form="plan-in-modal" data-id="${r.id}"><div class="grid grid-2"><div class="form-field"><label for="modal-plan-date">Plan it for</label><input type="date" id="modal-plan-date" name="date" required value="${today()}"></div><div class="form-field"><label for="modal-plan-slot">Meal</label><select name="slot" id="modal-plan-slot"><option>Breakfast</option><option>Lunch</option><option selected>Dinner</option><option>Snack</option></select></div></div><button type="submit" class="btn">+ Add to meal plan</button></form></section></div>`;}
if(ui.modal.type==='activity'){const a=activities.find(x=>x.id===ui.modal.id);if(!a)return '';const sec=ui.session;return `<div class="modal-backdrop" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><span class="caps">${e(a.level)} · ${a.minutes}-MIN IDEA</span><h2 id="modal-title" style="margin-top:8px">${a.icon} ${e(a.name)}</h2><p>${e(a.desc)}</p></div><button class="icon-btn" data-action="close-modal" aria-label="Close movement">×</button></div><ol class="modal-steps">${a.steps.map(s=>`<li>${e(s)}</li>`).join('')}</ol><div class="info-note danger-note">${e(a.warning)}</div><div class="timer" id="session-clock" role="timer" aria-label="Session time remaining">${Math.floor((sec?.remainingSec??a.minutes*60)/60).toString().padStart(2,'0')}:${((sec?.remainingSec??0)%60).toString().padStart(2,'0')}</div><p class="timer-caption">Optional timer. Pause or stop any time.</p><div class="modal-actions" style="justify-content:center">${actionBtn('timer-toggle',sec?.running?'Pause timer':'Start timer','', 'secondary')}${actionBtn('timer-reset','Reset','','ghost')}${actionBtn('timer-finish','Finish & log','','secondary')}</div><div class="line"></div><form data-form="activity-manual" data-id="${a.id}"><div class="form-field"><label for="completed-minutes">Already did it? Log actual minutes (optional)</label><input type="number" id="completed-minutes" name="minutes" min="1" max="300" required placeholder="Minutes you completed"></div><div class="form-field"><label for="activity-note">How did it feel? (optional)</label><select id="activity-note" name="note"><option value="">No note</option><option>Comfortable</option><option>Some effort</option><option>Needed to stop or adjust</option></select></div><button type="submit" class="btn ghost">Save my activity</button></form></section></div>`;}
return '';}
function updateTimerDisplay(){if(!ui.session)return;const s=ui.session,clock=document.getElementById('session-clock');if(clock)clock.textContent=`${String(Math.floor(s.remainingSec/60)).padStart(2,'0')}:${String(s.remainingSec%60).padStart(2,'0')}`;}
function stopTimer(){if(timerInterval){clearInterval(timerInterval);timerInterval=null;}if(ui.session)ui.session.running=false;}
function tick(){if(!ui.session?.running)return;ui.session.remainingSec=Math.max(0,ui.session.remainingSec-1);updateTimerDisplay();if(ui.session.remainingSec===0){stopTimer();notify('Timer finished. Log the activity if you completed it.');render();}}
function closeModal(){stopTimer();ui.modal=null;ui.session=null;render();}
function showSession(id){const a=activities.find(x=>x.id===id);if(!a)return;ui.modal={type:'activity',id};ui.session={durationSec:a.minutes*60,remainingSec:a.minutes*60,running:false};render();}
function finishSession(){const s=ui.session;if(!s)return;const elapsed=s.durationSec-s.remainingSec;if(elapsed<30){notify('No activity logged yet. You can enter your actual minutes below.');return;}const id=ui.modal.id, a=activities.find(x=>x.id===id);data.activityLogs.push({id:uid(),date:today(),at:new Date().toISOString(),activityId:id,minutes:Math.max(1,Math.round(elapsed/60)),category:a.category,note:'Timer session'});save();closeModal();notify('Movement saved. Thanks for checking in with yourself.');}
function submitForm(form){const value=Object.fromEntries(new FormData(form));const formType=form.dataset.form;
 if(formType==='onboard'){data.profile={...data.profile,name:(value.name||'').trim(),availableMinutes:clamp(value.availableMinutes,5,60),foodPreferences:(value.foodPreferences||'').trim(),avoidFoods:(value.avoidFoods||'').trim(),focus:[...ui.selectedFocus],setupDone:true};save();ui.page='today';render(true);notify('Welcome to your little corner of wellness.');return;}
 if(formType==='settings'){data.profile={...data.profile,name:(value.name||'').trim(),availableMinutes:clamp(value.availableMinutes,5,60),foodPreferences:(value.foodPreferences||'').trim(),avoidFoods:(value.avoidFoods||'').trim(),waterGoalOz:value.waterGoalOz?clamp(value.waterGoalOz,1,256):null};save();render();notify('Preferences saved.');return;}
 if(formType==='pantry'){const name=(value.name||'').trim();if(!name)return;data.pantry.push({id:uid(),name,quantity:(value.quantity||'').trim(),expiry:value.expiry||null});save();render();notify('Added to pantry.');return;}
 if(formType==='shopping'){const name=(value.name||'').trim();if(!name)return;data.shopping.push(...uniqueShopping(data.shopping,[name]));save();render();notify('Grocery list updated.');return;}
 if(formType==='meal-plan'||formType==='plan-in-modal'){const recipeId=formType==='plan-in-modal'?form.dataset.id:value.recipeId;if(!recipes.some(r=>r.id===recipeId))return;const date=value.date||today();data.mealPlan.push({id:uid(),recipeId,date,slot:value.slot||'Dinner'});save();ui.modal=null;ui.kitchenTab='plan';ui.page='kitchen';render(true);notify('Meal idea added to your plan.');return;}
 if(formType==='water'){const amount=Number(value.amount);if(!(amount>0&&amount<=256))return;data.water.push({id:uid(),date:today(),amount,at:new Date().toISOString()});save();render();notify('Water logged.');return;}
 if(formType==='water-target'){data.profile.waterGoalOz=value.target?clamp(value.target,1,256):null;save();render();notify('Water goal updated.');return;}
 if(formType==='goal'){const target=Number(value.target);if(!(target>0&&target<=10000))return;data.goals.push({id:uid(),title:(value.title||'').trim().slice(0,100),metric:value.metric||'manual',target:Math.round(target)});save();render();notify('Your goal is ready — and always editable.');return;}
 if(formType==='edit-goal'){const g=data.goals.find(x=>x.id===form.dataset.id);if(!g)return;const target=Number(value.target);if(!(target>0&&target<=10000))return;g.title=(value.title||'').trim().slice(0,100);g.metric=METRICS[value.metric]?value.metric:'manual';g.target=Math.round(target);save();ui.editGoalId=null;render();notify('Goal updated.');return;}
 if(formType==='supplement'){const name=(value.name||'').trim();if(!name)return;data.supplements.push({id:uid(),name,instructions:(value.instructions||'').trim(),frequency:value.frequency||'daily',time:value.time||'',reviewed:value.reviewed==='yes'});save();render();notify('Supplement added to your personal list.');return;}
 if(formType==='checkin'){const selected={id:uid(),date:today(),at:new Date().toISOString(),energy:value.energy?Number(value.energy):null,sleep:value.sleep||'',comfort:value.comfort||'',note:(value.note||'').trim()};data.checkins=data.checkins.filter(x=>x.date!==today());data.checkins.push(selected);save();render();notify('Reflection saved privately on this device.');return;}
 if(formType==='weight'){const n=Number(value.weight);if(!(n>=50&&n<=800))return;data.weights.push({id:uid(),date:today(),weight:n,at:new Date().toISOString()});save();render();notify('Private note saved.');return;}
 if(formType==='reminder'){if(!/^\d{2}:\d{2}$/.test(value.time||''))return;data.reminders.push({id:uid(),type:value.type||'water',time:value.time,enabled:true,lastSentDate:null});save();render();notify('Reminder saved; it works while this page is open.');return;}
 if(formType==='activity-manual'){const minutes=Number(value.minutes),a=activities.find(x=>x.id===form.dataset.id);if(!a||minutes<1||minutes>300)return;data.activityLogs.push({id:uid(),date:today(),at:new Date().toISOString(),activityId:a.id,minutes,category:a.category,note:value.note||''});save();closeModal();notify('Movement saved.');return;}
}
function handleAction(action,el){const id=el.dataset.id;const remove=(field)=>{const before=data[field].length;data[field]=data[field].filter(x=>x.id!==id);if(before!==data[field].length){save();render();notify('Entry removed.');}};
 switch(action){
 case 'page':ui.page=el.dataset.page||'today';render(true);break;
 case 'kitchen-tab':ui.kitchenTab=el.dataset.tab;render();break;
 case 'wellness-tab':ui.wellnessTab=el.dataset.tab;render();break;
 case 'move-filter':ui.moveFilter=el.dataset.filter||'all';render();break;
 case 'onboard-next':ui.setupStep=2;render(true);break;
 case 'onboard-back':ui.setupStep=1;render(true);break;
 case 'skip-setup':data.profile.setupDone=true;data.profile.focus=[...ui.selectedFocus];save();render(true);break;
 case 'toggle-focus':{const f=el.dataset.focus;ui.selectedFocus=ui.selectedFocus.includes(f)?ui.selectedFocus.filter(x=>x!==f):[...ui.selectedFocus,f];render();break;}
 case 'toggle-profile-focus':{const f=el.dataset.focus;const form=document.querySelector('[data-form="settings"]');if(form){const v=Object.fromEntries(new FormData(form));data.profile.name=(v.name||'').trim();data.profile.availableMinutes=clamp(v.availableMinutes,5,60);data.profile.foodPreferences=v.foodPreferences||'';data.profile.avoidFoods=v.avoidFoods||'';data.profile.waterGoalOz=v.waterGoalOz?clamp(v.waterGoalOz,1,256):null;}data.profile.focus=data.profile.focus.includes(f)?data.profile.focus.filter(x=>x!==f):[...data.profile.focus,f];save();render();break;}
 case 'add-water':{const amount=Number(el.dataset.oz);if(!(amount>0))return;data.water.push({id:uid(),date:today(),amount,at:new Date().toISOString()});save();render();notify(`Logged ${amount} oz water.`);break;}
 case 'remove-water':remove('water');break;
 case 'remove-pantry':remove('pantry');break;
 case 'remove-shopping':remove('shopping');break;
 case 'toggle-shopping':{const item=data.shopping.find(x=>x.id===id);if(item){item.checked=el.checked;save();render();}break;}
 case 'move-shopping':{const chosen=data.shopping.filter(x=>x.checked);const existing=new Set(data.pantry.map(x=>x.name.toLowerCase()));for(const x of chosen){if(!existing.has(x.name.toLowerCase()))data.pantry.push({id:uid(),name:x.name,quantity:'',expiry:null});}data.shopping=data.shopping.filter(x=>!x.checked);save();render();notify('Checked groceries added to your pantry.');break;}
 case 'clear-shopping':data.shopping=data.shopping.filter(x=>!x.checked);save();render();notify('Checked items removed.');break;
 case 'recipe-details':ui.modal={type:'recipe',id};render();break;
 case 'recipe-missing':{const r=recipes.find(x=>x.id===id);if(!r)return;const missing=missingIngredients(data.pantry,r.ingredients);data.shopping.push(...uniqueShopping(data.shopping,missing));save();render();notify(missing.length?'Missing ingredients added to your grocery list.':'All listed ingredients appear in your pantry.');break;}
 case 'log-direct-meal':{const r=recipes.find(x=>x.id===id);if(!r)return;data.mealLogs.push({id:uid(),recipeId:r.id,date:today(),at:new Date().toISOString()});save();ui.modal=null;render();notify('Meal logged as tried.');break;}
 case 'log-meal':{const p=data.mealPlan.find(x=>x.id===id);if(!p)return;data.mealLogs.push({id:uid(),recipeId:p.recipeId,date:today(),at:new Date().toISOString()});save();render();notify('Meal logged as tried.');break;}
 case 'remove-plan':remove('mealPlan');break;
 case 'session':showSession(id);break;
 case 'close-modal':closeModal();break;
 case 'timer-toggle':{if(!ui.session)return;if(ui.session.remainingSec===0)ui.session.remainingSec=ui.session.durationSec;ui.session.running=!ui.session.running;if(ui.session.running){stopTimer();ui.session.running=true;timerInterval=setInterval(tick,1000);}else stopTimer();render();break;}
 case 'timer-reset':{stopTimer();if(ui.session)ui.session.remainingSec=ui.session.durationSec;render();break;}
 case 'timer-finish':finishSession();break;
 case 'remove-activity':remove('activityLogs');break;
 case 'edit-goal':ui.editGoalId=ui.editGoalId===id?null:id;render();break;
 case 'remove-goal':{data.goals=data.goals.filter(x=>x.id!==id);data.goalLogs=data.goalLogs.filter(x=>x.goalId!==id);save();render();notify('Goal removed.');break;}
 case 'log-manual-goal':data.goalLogs.push({id:uid(),goalId:id,date:today(),at:new Date().toISOString()});save();render();notify('Progress noted.');break;
 case 'add-win':data.wins.push({id:uid(),date:today(),label:el.dataset.label||'Something good',at:new Date().toISOString()});save();render();notify('A little win worth keeping.');break;
 case 'remove-win':remove('wins');break;
 case 'take-supp':{if(!data.supplements.some(x=>x.id===id))return;if(!data.suppLogs.some(x=>x.supplementId===id&&x.date===today())){data.suppLogs.push({id:uid(),supplementId:id,date:today(),at:new Date().toISOString()});save();render();notify('Intake recorded, not medically verified.');}break;}
 case 'undo-supp':data.suppLogs=data.suppLogs.filter(x=>!(x.supplementId===id&&x.date===today()));save();render();notify('Intake record removed for today.');break;
 case 'remove-supp':{data.supplements=data.supplements.filter(x=>x.id!==id);data.suppLogs=data.suppLogs.filter(x=>x.supplementId!==id);save();render();notify('Supplement removed with its logs.');break;}
 case 'remove-checkin':remove('checkins');break;
 case 'remove-weight':remove('weights');break;
 case 'toggle-reminder':{const rem=data.reminders.find(x=>x.id===id);if(rem){rem.enabled=!rem.enabled;rem.lastSentDate=null;save();render();}break;}
 case 'remove-reminder':remove('reminders');break;
 case 'request-notifications':{if(!('Notification' in window)){notify('This browser does not support system notifications.');return;}Notification.requestPermission().then(permission=>{render();notify(permission==='granted'?'Permission granted. Reminders still require the page to be open.':'You can still use the app without notifications.');});break;}
 case 'export':{const text=JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2);const blob=new Blob([text],{type:'application/json'}),url=URL.createObjectURL(blob),anchor=document.createElement('a');anchor.href=url;anchor.download=`jennys-bloom-export-${today()}.json`;document.body.appendChild(anchor);anchor.click();anchor.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Your private browser data has been exported.');break;}
 case 'restore':document.getElementById('backup-file')?.click();break;
 case 'clear-all':{if(window.confirm('Delete all Jenny\'s Bloom data in this browser? This cannot be undone.')){stopTimer();localStorage.removeItem(STORAGE);data=fresh();ui={...ui,page:'today',kitchenTab:'recipes',wellnessTab:'water',modal:null,session:null,setupStep:1,selectedFocus:[]};render(true);notify('Local app data cleared.');}break;}
 default:break;
 }
}
document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el)return;if(el.tagName.toLowerCase()==='a')event.preventDefault();handleAction(el.dataset.action,el);});
document.addEventListener('submit',event=>{const f=event.target.closest('form[data-form]');if(!f)return;event.preventDefault();submitForm(f);});
function cleanBackup(raw){
 if(!raw||raw.version!==1||!raw.profile||typeof raw.profile!=='object')throw Error('Not a supported Jenny’s Bloom backup.');
 const out=fresh();
 const string=(val,max=500)=>typeof val==='string'?val.slice(0,max):'';
 const allowedId=/^[a-zA-Z0-9_-]{1,100}$/;
 out.profile={...out.profile,...{
  name:string(raw.profile.name,50),setupDone:!!raw.profile.setupDone,
  focus:Array.isArray(raw.profile.focus)?raw.profile.focus.filter(v=>FOCUS.some(([label])=>label===v)).slice(0,12):[],
  availableMinutes:clamp(raw.profile.availableMinutes||10,5,60),
  avoidFoods:string(raw.profile.avoidFoods,300),foodPreferences:string(raw.profile.foodPreferences,300),
  waterGoalOz:raw.profile.waterGoalOz?clamp(raw.profile.waterGoalOz,1,256):null,
  remindersEnabled:false
 }};
 for(const k of Object.keys(out).filter(x=>Array.isArray(out[x]))){
  if(!Array.isArray(raw[k])||raw[k].length>5000)throw Error('Backup entries are missing or too large.');
  out[k]=raw[k].filter(v=>v&&typeof v==='object'&&!Array.isArray(v)&&allowedId.test(v.id)).map(v=>{
   const item={};
   for(const [key,value] of Object.entries(v)){
    if(key==='__proto__'||key==='constructor'||key==='prototype')continue;
    if(key==='id'||key.endsWith('Id')){if(typeof value==='string'&&allowedId.test(value))item[key]=value;}
    else if(typeof value==='string')item[key]=string(value,2000);
    else if(typeof value==='number'&&Number.isFinite(value))item[key]=clamp(value,0,100000);
    else if(typeof value==='boolean'||value===null)item[key]=value;
   }
   return item;
  });
 }
 return out;
}
document.addEventListener('change',async event=>{
 const target=event.target;
 if(target?.dataset?.filter==='recipe'){ui.recipeFilter=target.value;render();return;}
 if(target?.id!=='backup-file'||!target.files?.length)return;
 const file=target.files[0];
 if(file.size>2_000_000){notify('This backup is larger than the 2 MB limit.');target.value='';return;}
 try{
  const restored=cleanBackup(JSON.parse(await file.text()));
  if(!window.confirm('Replace all current browser entries with this backup? Export your existing data first if you wish to keep it.'))return;
  stopTimer();data=restored;save();ui={...ui,page:'today',kitchenTab:'recipes',wellnessTab:'water',modal:null,session:null,setupStep:1,selectedFocus:[...data.profile.focus]};render(true);notify('Backup restored on this device.');
 }catch(err){notify(err.message||'Could not restore that file.');}
 finally{target.value='';}
});
function checkReminders(){if(document.visibilityState!=='visible'||!data.profile.setupDone)return;const now=new Date(),hhmm=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;let changes=false;for(const r of data.reminders){if(!r.enabled||r.time!==hhmm||r.lastSentDate===today())continue;r.lastSentDate=today();changes=true;const message='An optional moment for yourself, whenever it fits.';if('Notification' in window&&Notification.permission==='granted'){try{new Notification('Jenny’s Bloom ✿',{body:message,tag:'bloom-'+r.id});}catch{notify(message);}}else notify(message);}if(changes)save();}
ui.wellnessTab='water';
render();
setInterval(checkReminders,30000);
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
